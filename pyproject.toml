[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pmi-bench"
version = "0.5.0"
description = "Synthetic operational benchmark for SME data and code maintenance"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
pmi-bench = "pmi_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pmi_bench"]
